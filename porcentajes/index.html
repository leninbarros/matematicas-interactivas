<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Porcentajes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Fredoka', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .grid-square {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-white text-slate-800 font-sans h-screen w-screen flex flex-col items-center justify-center p-4 md:p-6 overflow-hidden select-none">

    <main class="w-full max-w-4xl flex flex-col items-center gap-6 my-auto">
        
        <!-- Título principal centrado -->
        <header class="w-full flex items-center justify-center gap-3">
            <i class="fa-solid fa-chart-pie text-3xl md:text-4xl text-blue-600"></i>
            <h1 class="text-3xl md:text-4xl font-black font-display text-blue-600 tracking-wide text-center">
                Visualizador de Porcentajes
            </h1>
        </header>

        <!-- Contenedor Principal en 2 Columnas (A la izquierda Cuadrícula, a la derecha Controles) -->
        <section class="w-full flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12 max-w-3xl">
            
            <!-- Columna Izquierda: Cuadrícula 10x10 -->
            <div class="flex-1 flex justify-center w-full max-w-[320px]">
                <div class="w-full aspect-square bg-slate-100 p-2.5 rounded-2xl border-2 border-slate-200/80 shadow-sm">
                    <div id="grid-container" class="grid grid-cols-10 grid-rows-10 gap-1 w-full h-full">
                        <!-- Cuadritos generados dinámicamente -->
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Controles alineados verticalmente -->
            <div class="flex-1 flex flex-col items-center justify-center gap-5 w-full max-w-[340px]">
                
                <!-- Entrada del Total -->
                <div class="flex flex-col items-center w-full gap-1">
                    <label for="total-input" class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 text-center">
                        INGRESA EL VALOR TOTAL (100%):
                    </label>
                    <div class="w-full bg-slate-50/50 p-1.5 rounded-2xl flex justify-center">
                        <input id="total-input" type="number" value="500" min="1" step="any"
                            class="w-48 bg-white border-2 border-blue-400/80 rounded-2xl px-4 py-1.5 text-2xl font-black font-display text-blue-600 text-center shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all">
                    </div>
                </div>

                <!-- Botones 1% y 10% de lado a lado -->
                <div class="grid grid-cols-2 gap-3 w-full">
                    <!-- Botón 1% -->
                    <button onclick="calculatePercentage(1)" 
                        class="bg-[#d97706] hover:bg-[#b45309] active:scale-95 text-white font-black font-display px-3 py-3 rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-square text-xs"></i>
                        Calcular 1%
                    </button>

                    <!-- Botón 10% -->
                    <button onclick="calculatePercentage(10)" 
                        class="bg-[#2563eb] hover:bg-[#1d4ed8] active:scale-95 text-white font-black font-display px-3 py-3 rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-table-cells text-xs"></i>
                        Calcular 10%
                    </button>
                </div>

                <!-- Tarjeta de Fórmula Aplicada -->
                <div class="w-full bg-[#f1f5f9]/80 border border-slate-200/80 p-4 rounded-2xl space-y-2">
                    <div class="flex items-center gap-1.5 text-slate-500 font-extrabold text-[10px] uppercase tracking-wider">
                        <span class="text-blue-600 font-mono text-xs">√x</span>
                        <span>FÓRMULA APLICADA:</span>
                    </div>
                    <div id="formula-box" class="w-full bg-white border border-slate-200/80 rounded-xl py-2.5 px-2 text-center text-slate-700 font-mono text-xs md:text-sm font-semibold shadow-sm">
                        Total ÷ 100 = Valor de 1 cuadro
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- JavaScript Lógica -->
    <script>
        let activePercentage = 0;

        const gridContainer = document.getElementById('grid-container');
        const totalInput = document.getElementById('total-input');
        const formulaBox = document.getElementById('formula-box');

        // Crear la cuadrícula de 100 casillas al inicio
        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 1; i <= 100; i++) {
                const sq = document.createElement('div');
                sq.id = `sq-${i}`;
                sq.className = 'grid-square rounded-[3px] bg-white border border-slate-200/80 flex items-center justify-center font-bold text-[8px] md:text-[9px] text-white select-none';
                gridContainer.appendChild(sq);
            }
        }

        // Obtener valor total del input
        function getTotal() {
            const val = parseFloat(totalInput.value);
            return isNaN(val) || val <= 0 ? 0 : val;
        }

        // Formatear números para evitar demasiados decimales
        function formatNum(num) {
            return Number.isInteger(num) ? num.toString() : num.toFixed(2);
        }

        // Acción al hacer clic en 1% o 10%
        function calculatePercentage(percent) {
            activePercentage = percent;
            const total = getTotal();
            const valueOne = total / 100;
            const valueTen = valueOne * 10;

            const formattedOne = formatNum(valueOne);
            const formattedTen = formatNum(valueTen);

            // Actualizar el estado y color de las casillas
            for (let i = 1; i <= 100; i++) {
                const sq = document.getElementById(`sq-${i}`);
                if (i <= percent) {
                    if (percent === 1) {
                        sq.className = 'grid-square rounded-[3px] bg-[#d97706] border border-amber-700 flex items-center justify-center font-extrabold text-[9px] text-white shadow-sm';
                        sq.textContent = formattedOne;
                    } else {
                        sq.className = 'grid-square rounded-[3px] bg-[#2563eb] border border-blue-700 flex items-center justify-center font-extrabold text-[8px] text-white shadow-sm';
                        sq.textContent = formattedOne;
                    }
                } else {
                    sq.className = 'grid-square rounded-[3px] bg-white border border-slate-200/80 flex items-center justify-center font-bold text-[8px] text-white';
                    sq.textContent = '';
                }
            }

            // Actualizar texto de la fórmula según la selección
            if (percent === 1) {
                formulaBox.innerHTML = `${total} ÷ 100 = <span class="text-[#d97706] font-bold">${formattedOne}</span> (1%)`;
            } else if (percent === 10) {
                formulaBox.innerHTML = `${total} ÷ 10 = <span class="text-[#2563eb] font-bold">${formattedTen}</span> (10%)`;
            }
        }

        // Escuchar cambios en el input del total para recalcular automáticamente
        totalInput.addEventListener('input', () => {
            if (activePercentage > 0) {
                calculatePercentage(activePercentage);
            }
        });

        // Inicializar al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            initGrid();
        });
    </script>
</body>
</html>
